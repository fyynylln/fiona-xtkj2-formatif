<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kumpulan Tombol</title>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            color: #2c3e50;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #16a085;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: rgba(22, 160, 133, 0.2);
        }

        .btn-outline {
            background-color: #ffffff;
            border: 2px solid #2c3e50;
        }

        .btn-send {
            background-color: #e67e22;
            color: #ffffff;
        }

        .btn-secondary, .btn-outline {
            color: #2c3e50;
        }

        .btn-primary:hover {
            background-color: #117a65;
        }

        .btn-secondary:hover {
            background-color: rgba(22, 160, 133, 0.4);
        }

        .btn-outline:hover {
            background-color: #ecf0f1;
        }

        .btn-send:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>
    <main>
        <h2>Normal</h2>
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer style="margin-top: 40px;">
        <a href="../index.html" style="color: #16a085;">Kembali ke Beranda</a>
    </footer>
</body>
</html>
